[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-tool-agent"
version = "0.1.0"
description = "Chat agent with one tool (web search): fast, cited, with timestamped episodic memory."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
search = ["ddgs>=9"]
dev = ["pytest>=8"]

[project.scripts]
one-tool-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
